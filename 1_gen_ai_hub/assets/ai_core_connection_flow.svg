<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Core 연결과 deployment 확인 흐름</title>
  <desc id="desc">Jupyter kernel이 환경 설정을 읽고 AI Core에 인증한 뒤 RUNNING deployment를 확인하여 사용할 모델을 선택하는 과정</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef7ff"/><stop offset="1" stop-color="#dceeff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#0b4d8d" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <rect x="60" y="70" width="194" height="58" rx="29" fill="#1474d4"/>
  <text x="157" y="109" text-anchor="middle" fill="white" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700">AI CORE</text>
  <text x="60" y="210" fill="#103c70" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="55" font-weight="700">AI Core에 연결하고 실행 가능한 모델을 확인하기</text>
  <text x="60" y="270" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="27">Jupyter kernel에서 인증 정보를 읽고, RUNNING deployment 중 사용할 LLM 모델을 선택합니다.</text>
  <g filter="url(#shadow)" fill="white"><rect x="55" y="400" width="330" height="270" rx="26"/><rect x="445" y="400" width="330" height="270" rx="26"/><rect x="835" y="400" width="330" height="270" rx="26"/><rect x="1225" y="400" width="320" height="270" rx="26"/></g>
  <g fill="none" stroke="#1474d4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M404 535h22m-11-16 17 16-17 16"/><path d="M794 535h22m-11-16 17 16-17 16"/><path d="M1184 535h22m-11-16 17 16-17 16"/></g>
  <g font-family="Arial, Apple SD Gothic Neo, sans-serif">
    <g fill="#1474d4"><circle cx="92" cy="458" r="28"/><circle cx="482" cy="458" r="28"/><circle cx="872" cy="458" r="28"/><circle cx="1262" cy="458" r="28"/></g>
    <g fill="white" text-anchor="middle" font-size="23" font-weight="700"><text x="92" y="467">1</text><text x="482" y="467">2</text><text x="872" y="467">3</text><text x="1262" y="467">4</text></g>
    <g fill="#103c70" text-anchor="middle" font-size="25" font-weight="700"><text x="220" y="520">환경 설정 읽기</text><text x="610" y="520">AI Core 인증</text><text x="1000" y="520">Deployment 조회</text><text x="1385" y="520">모델 선택</text></g>
    <g fill="#466b90" font-size="20"><text x="85" y="572">.env의 연결 정보</text><text x="475" y="572">OAuth access token</text><text x="865" y="572">상태가 RUNNING인 항목</text><text x="1255" y="572">LLM_MODEL로 사용할</text><text x="85" y="600">비밀값은 화면에 표시하지 않음</text><text x="475" y="600">client secret은 출력하지 않음</text><text x="865" y="600">모델명과 scenario 확인</text><text x="1255" y="600">deployment 확인</text></g>
    <g fill="#6c89a8" font-size="16"><text x="85" y="645">Jupyter kernel</text><text x="475" y="645">AI Core REST API</text><text x="865" y="645">GET /v2/lm/deployments</text><text x="1255" y="645">다음 LLM 실습 준비</text></g>
  </g>
</svg>
