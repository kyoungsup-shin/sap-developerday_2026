<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2052" viewBox="0 0 2200 2052" role="img" aria-labelledby="title desc">
  <title id="title">Orchestration Agent Key Points</title>
  <desc id="desc">Seven orchestration-agent key points mapped to their solutions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8ff"/>
      <stop offset="100%" stop-color="#f0e8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="11" stdDeviation="13" flood-color="#6f4a9e" flood-opacity="0.13"/>
    </filter>
    <style>
      .heading { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-weight: 700; fill: #143666; }
      .body { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; fill: #62458d; }
      .eyebrow { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 21px; font-weight: 800; letter-spacing: 2px; fill: #8757ae; }
      .cardtitle { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 31px; font-weight: 700; fill: #143666; }
      .solution { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 27px; font-weight: 700; fill: #4f2f72; }
      .number { font-family: Arial, sans-serif; font-size: 29px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>
  <rect x="16" y="16" width="2168" height="2020" rx="34" fill="url(#background)"/>
  <rect x="72" y="72" width="198" height="60" rx="30" fill="#7844aa"/>
  <text x="171" y="111" text-anchor="middle" class="number" font-size="23">SUMMARY</text>
  <text x="72" y="218" class="heading" font-size="60">Orchestration Agent Key Points</text>
  <text x="72" y="277" class="body" font-size="31">Orchestration Agent의 핵심 고려 사항과 BAIP · Joule Studio 기반 솔루션을 연결합니다.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="336" width="2056" height="194" rx="24" fill="#ffffff"/>
    <rect x="72" y="572" width="2056" height="194" rx="24" fill="#ffffff"/>
    <rect x="72" y="808" width="2056" height="194" rx="24" fill="#ffffff"/>
    <rect x="72" y="1044" width="2056" height="194" rx="24" fill="#ffffff"/>
    <rect x="72" y="1280" width="2056" height="194" rx="24" fill="#ffffff"/>
    <rect x="72" y="1516" width="2056" height="194" rx="24" fill="#ffffff"/>
    <rect x="72" y="1752" width="2056" height="194" rx="24" fill="#ffffff"/>
  </g>

  <g>
    <circle cx="145" cy="433" r="38" fill="#7844aa"/><text x="145" y="443" text-anchor="middle" class="number">1</text>
    <text x="220" y="385" class="eyebrow">KEY POINT</text>
    <text x="220" y="430" class="cardtitle" font-size="24">업무 요청을 이해할 근거를 어떻게 확보할까?</text>
    <text x="220" y="470" class="body" font-size="18" font-weight="700">(Orchestration Delegation 근거)</text>
    <text x="1090" y="452" text-anchor="middle" class="body" font-size="58" font-weight="300">→</text>
    <text x="1190" y="408" class="eyebrow">SOLUTION</text><text x="1190" y="456" class="solution">BAIP Grounding</text>

    <circle cx="145" cy="669" r="38" fill="#7844aa"/><text x="145" y="679" text-anchor="middle" class="number">2</text>
    <text x="220" y="621" class="eyebrow">KEY POINT</text>
    <text x="220" y="666" class="cardtitle" font-size="24">업무 근거 기반 Agent 할당 결과를 수집·평가하는 방법?</text>
    <text x="220" y="706" class="body" font-size="18" font-weight="700">(Orchestration Delegation 판단)</text>
    <text x="1090" y="688" text-anchor="middle" class="body" font-size="58" font-weight="300">→</text>
    <text x="1190" y="644" class="eyebrow">SOLUTION</text><text x="1190" y="692" class="solution">RPT Decision Route</text>
    <rect x="1512" y="652" width="104" height="34" rx="17" fill="#efe4ff"/><text x="1564" y="675" text-anchor="middle" class="body" font-size="16" font-weight="800" fill="#6b3a96">GA 예정</text>

    <circle cx="145" cy="905" r="38" fill="#7844aa"/><text x="145" y="915" text-anchor="middle" class="number">3</text>
    <text x="220" y="857" class="eyebrow">KEY POINT</text>
    <text x="220" y="902" class="cardtitle" font-size="24">Orchestration Agent의 작업 할당 정확도를 높이는 방법?</text>
    <text x="220" y="942" class="body" font-size="18" font-weight="700">(Orchestration Delegation 정확도)</text>
    <text x="1090" y="924" text-anchor="middle" class="body" font-size="58" font-weight="300">→</text>
    <text x="1190" y="880" class="eyebrow">SOLUTION</text><text x="1190" y="928" class="solution">Agent with ReAct CoT</text>

    <circle cx="145" cy="1141" r="38" fill="#7844aa"/><text x="145" y="1151" text-anchor="middle" class="number">4</text>
    <text x="220" y="1093" class="eyebrow">KEY POINT</text>
    <text x="220" y="1138" class="cardtitle" font-size="24">작업 할당 과정의 권한·정책을 관리하는 방법?</text>
    <text x="220" y="1178" class="body" font-size="18" font-weight="700">(Orchestration Delegation 거버넌스)</text>
    <text x="1090" y="1160" text-anchor="middle" class="body" font-size="58" font-weight="300">→</text>
    <text x="1190" y="1116" class="eyebrow">SOLUTION</text><text x="1190" y="1164" class="solution">Joule Studio &amp; Agent Gateway</text>

    <circle cx="145" cy="1377" r="38" fill="#7844aa"/><text x="145" y="1387" text-anchor="middle" class="number">5</text>
    <text x="220" y="1329" class="eyebrow">KEY POINT</text>
    <text x="220" y="1374" class="cardtitle" font-size="24">SubAgent가 필요한 맥락을 이어받게 하는 방법?</text>
    <text x="220" y="1414" class="body" font-size="18" font-weight="700">(SubAgent Context)</text>
    <text x="1090" y="1396" text-anchor="middle" class="body" font-size="58" font-weight="300">→</text>
    <text x="1190" y="1328" class="eyebrow">SOLUTION</text>
    <text x="1190" y="1370" class="solution" font-size="22">&#8226; Managed Joule Assistant &amp; Agent</text>
    <text x="1190" y="1410" class="solution" font-size="22">&#8226; Knowledge graph</text>
    <text x="1190" y="1450" class="solution" font-size="22">&#8226; BAIP Grounding</text>

    <circle cx="145" cy="1613" r="38" fill="#7844aa"/><text x="145" y="1623" text-anchor="middle" class="number">6</text>
    <text x="220" y="1565" class="eyebrow">KEY POINT</text>
    <text x="220" y="1610" class="cardtitle" font-size="24">SubAgent에 ML 도구를 효과적으로 연결하는 방법?</text>
    <text x="220" y="1650" class="body" font-size="18" font-weight="700">(SubAgent ML Tool)</text>
    <text x="1090" y="1632" text-anchor="middle" class="body" font-size="58" font-weight="300">→</text>
    <text x="1190" y="1588" class="eyebrow">SOLUTION</text><text x="1190" y="1636" class="solution">Narrow AI (RPT Tabular Classification)</text>

    <circle cx="145" cy="1849" r="38" fill="#7844aa"/><text x="145" y="1859" text-anchor="middle" class="number">7</text>
    <text x="220" y="1801" class="eyebrow">KEY POINT</text>
    <text x="220" y="1846" class="cardtitle" font-size="24">SubAgent의 리포트 도구를 연결하는 방법?</text>
    <text x="220" y="1886" class="body" font-size="18" font-weight="700">(SubAgent Report Tool)</text>
    <text x="1090" y="1868" text-anchor="middle" class="body" font-size="58" font-weight="300">→</text>
    <text x="1190" y="1824" class="eyebrow">SOLUTION</text><text x="1190" y="1872" class="solution">BAIP Orchestration</text>
  </g>
</svg>
