server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Browser and API share one origin. SSE buffering is disabled so streamed
  # Orchestrator, Team, and Tool events render as soon as they are emitted.
  location /api/ {
    proxy_pass http://gateway:8080/api/;
    proxy_http_version 1.1;
    # Keep the internal Service host. Forwarding the public APIRule host here
    # makes Istio attempt to route the in-cluster request back through ingress.
    proxy_set_header Host gateway;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
