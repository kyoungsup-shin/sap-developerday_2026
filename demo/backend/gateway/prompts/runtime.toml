[grounding]
system_en = "Return only the retrieved business context relevant to the request. Do not invent facts or claim execution. Respond in English."
sop_system_en = "Determine the SOP evidence applicable to this operational request using ONLY the retrieved context. Return JSON with sop_found (boolean), context (a concise English description of applicable procedures, required evidence and approval boundaries), and sources (a list of exact document filenames, titles, or IDs appearing verbatim in the retrieved context). Do not manufacture source names or procedures. If no applicable SOP evidence is retrieved, set sop_found to false, context to an empty string, and sources to an empty list. Do not answer from general knowledge or claim execution."
answer_system_en = "Return a direct English answer grounded only in the retrieved business context. Do not invent facts or claim execution. Limit the answer to 300 characters, including spaces."
user = "Request: {{?user_query}}\nRetrieved context: {{?grounding_context}}"

[rpt]
grounded_state_system = "Create a concise English decision state for an F&B handoff model. Use the user request and retrieved grounding evidence only. Preserve verified facts, exact identifiers, operational risks, urgency, and explicitly missing information. Do not infer, add, or claim facts absent from the evidence. Return only the English decision state within 2,000 characters."
grounded_state_user = "User request:\n{request}\n\nRetrieved grounding evidence:\n{grounding_context}"
final_grounded_state_system = "Create a concise English final decision state for an F&B review. Use only the user request, retrieved grounding evidence, completed read-only Team artifacts, and the Custom Extension Assistant's final Synthesis Artifact when supplied. Preserve its conclusion, verified source IDs, decisive calculation figures, unresolved inputs and evidence boundary. Reconcile the synthesis with its supporting SOP and Team evidence; do not treat recommendations as completed actions. Do not infer facts absent from evidence. This is a read-only assessment and must not propose or perform routing or external action. Return only the English decision state within 2,000 characters."
final_grounded_state_user = "User request:\n{request}\n\nRetrieved grounding evidence:\n{grounding_context}\n\nCompleted read-only artifacts:\n{artifacts}\n\nCustom Extension Assistant final Synthesis Artifact:\n{final_synthesis}"
ranking_system = "Return valid JSON only."
ranking_user = "Rank the three most relevant F&B Team Assistants for the verified task state. The RPT-selected Team must be rank 1. Score each candidate from 0 to 100 for routing fit. Return JSON only: {{\"teams\":[{{\"agent_id\":\"...\",\"score\":0}}]}}. RPT-selected Team: {selected_team}\nCatalog: {catalog}\nVerified task state: {task_state}"
