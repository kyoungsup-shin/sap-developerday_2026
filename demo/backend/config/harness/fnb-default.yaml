tools:
- name: search_business_context
  description: Finds a follow-up Context from product, material, production-line, equipment, or alias text in the
    request.
  required_parameter: request_text
  inputs:
  - name: request_text
    type: string
    required: true
    description: The original operational request or a product, material, or equipment identifier.
    example: CIP pump mechanical seal kit purchasing review
- name: retrieve_business_evidence
  description: Reads a CSV evidence bundle for domains authorized to the Specialist. Domain selection is enforced
    by server policy.
  required_parameter: context_id
  inputs:
  - name: context_id
    type: string
    required: true
    description: A Context ID returned by search_business_context or confirmed by a prior Artifact.
    example: CTX-EQP-CIP-SEAL
  policy_note: Domains are not caller inputs. The server applies them from the executing Specialist allow-list.
- name: calculate_profitability_scenarios
  description: Calculates unit cost, break-even volume, and quarterly profit for base and stress scenarios from
    product cost, volume, and exchange-rate sample records.
  required_parameter: context_id
  inputs:
  - name: context_id
    type: string
    required: true
    description: A Context ID linked to cost, demand, and BOM evidence.
    example: CTX-RM-STRAWBERRY
  policy_note: This Tool is callable only by the Profitability and Cost Specialist.
