apiVersion: v1
kind: Service
metadata:
  # The existing frontend Nginx image proxies /api to this DNS name.
  name: gateway
  labels:
    app.kubernetes.io/name: a2a-demo
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: a2a-demo
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: gateway-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-demo-backend
  labels:
    app.kubernetes.io/name: a2a-demo
    app.kubernetes.io/component: backend
spec:
  # SQLite state is on an RWO volume: keep exactly one Backend Pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: a2a-demo
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-demo
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # A PVC may not contain the subPath on first use.
        - name: initialize-state-volume
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /state/evaluations"]
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: gateway
          image: ${BACKEND_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway-http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: a2a-demo-runtime-config}
            - configMapRef: {name: a2a-demo-deployment-config}
            - secretRef: {name: a2a-demo-runtime-secret}
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway-http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway-http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: state, mountPath: /app/demo/backend/data/harness_state}
            - {name: state, mountPath: /app/demo/backend/data/evaluations, subPath: evaluations}
        - name: team-server
          image: ${BACKEND_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "gateway.team_server"]
          ports:
            - name: team-http
              containerPort: 8091
          envFrom:
            - configMapRef: {name: a2a-demo-runtime-config}
            - configMapRef: {name: a2a-demo-deployment-config}
            - secretRef: {name: a2a-demo-runtime-secret}
          readinessProbe:
            httpGet: {path: /healthz, port: team-http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: team-http}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: state, mountPath: /app/demo/backend/data/harness_state, readOnly: true}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: a2a-demo-state
