apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: a2a-demo-deployment-config
    envs:
      - deployment.env
replacements:
  - source:
      kind: ConfigMap
      name: a2a-demo-deployment-config
      fieldPath: data.PUBLIC_HOST
    targets:
      - select:
          kind: APIRule
          name: a2a-demo
        fieldPaths:
          - spec.hosts.0
